<!DOCTYPE html>
<html>
<head>
    <title>Distributed Multi-Room Chat Test</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 24px; background: #0f172a; color: #f8fafc; }
        .card { background: #1e293b; border-radius: 8px; padding: 20px; max-width: 650px; margin-bottom: 16px; border: 1px solid #334155; }
        input, button { padding: 8px 12px; margin: 4px; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: #fff; }
        button { cursor: pointer; background: #3b82f6; border-color: #3b82f6; font-weight: bold; }
        button:hover { background: #2563eb; }
        #messages { height: 260px; overflow-y: auto; background: #0b0f19; border: 1px solid #334155; padding: 12px; border-radius: 6px; font-family: monospace; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
        .online { background: #059669; }
        .offline { background: #dc2626; }
    </style>
</head>
<body>
<h2>🚀 Distributed Multi-Room Chat</h2>

<div class="card">
    <h3>1. Connect Instance</h3>
    <label>Connect to Port:</label>
    <select id="serverPort" style="padding: 8px; background: #0f172a; color: #fff; border-radius: 4px; border: 1px solid #475569;">
        <option value="8080">8080 (Pod 1)</option>
        <option value="8081">8081 (Pod 2)</option>
    </select>
    <button onclick="connect()">Connect</button>
    <span id="status" class="badge offline">Disconnected</span>
</div>

<div class="card">
    <h3>2. Join Room & Chat</h3>
    <input type="text" id="username" placeholder="Your Name (e.g. Alice)" value="Alice" />
    <input type="text" id="roomId" placeholder="Room ID (e.g. general)" value="general" />
    <button onclick="subscribeRoom()">Subscribe</button>
    <br/><br/>
    <input type="text" id="messageInput" placeholder="Type a message..." style="width: 70%;" />
    <button onclick="sendMessage()">Send</button>
</div>

<div class="card">
    <h3>Message Stream</h3>
    <div id="messages"></div>
</div>

<script>
    let stompClient = null;
    let currentSubscription = null;

    function connect() {
        const port = document.getElementById('serverPort').value;
        const socket = new SockJS(`http://localhost:${port}/ws-chat`);
        stompClient = Stomp.over(socket);
        stompClient.debug = null; // silence console spam

        stompClient.connect({}, function (frame) {
            document.getElementById('status').innerText = `Connected (Port ${port})`;
            document.getElementById('status').className = "badge online";
        }, function (error) {
            document.getElementById('status').innerText = "Disconnected";
            document.getElementById('status').className = "badge offline";
        });
    }

    function subscribeRoom() {
        const roomId = document.getElementById('roomId').value;
        if (!stompClient || !stompClient.connected) {
            alert("Please connect to a server first!");
            return;
        }
        if (currentSubscription) {
            currentSubscription.unsubscribe();
        }

        const destination = `/topic/room.${roomId}`;
        currentSubscription = stompClient.subscribe(destination, function (response) {
            const msg = JSON.parse(response.body);
            const messageBox = document.getElementById('messages');
            messageBox.innerHTML += `<div><strong>[${msg.roomId}] ${msg.senderId}:</strong> ${msg.content} <span style="color: #64748b; font-size: 11px;">(${new Date(msg.timestamp).toLocaleTimeString()})</span></div>`;
            messageBox.scrollTop = messageBox.scrollHeight;
        });

        alert(`Subscribed to room: ${roomId}`);
    }

    function sendMessage() {
        const roomId = document.getElementById('roomId').value;
        const senderId = document.getElementById('username').value;
        const content = document.getElementById('messageInput').value;

        if (!content.trim()) return;

        stompClient.send("/app/chat.send", {}, JSON.stringify({
            roomId: roomId,
            senderId: senderId,
            content: content
        }));

        document.getElementById('messageInput').value = "";
    }
</script>
</body>
</html>
